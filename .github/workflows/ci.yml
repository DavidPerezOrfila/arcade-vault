name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        # v5 corre en node24; v4 targetea node20 (deprecado en runners)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # El build prerenderiza paginas que crean el client de Supabase;
      # con placeholders no lanzan y las queries fallan con catch (-> []).
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'placeholder'
          SUPABASE_SERVICE_ROLE_KEY: 'placeholder'

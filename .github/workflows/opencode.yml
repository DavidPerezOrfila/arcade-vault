name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Solo owner/miembros (protege NVIDIA_API_KEY) y solo si el comentario
    # contiene /oc o /opencode. Ver workflows/opencode-loop.md.
    # startsWith('/oc') cubre también '/opencode'; solo owner/miembros.
    if: |
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER') &&
      (startsWith(github.event.comment.body, '/oc') || contains(github.event.comment.body, ' /oc'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          model: nvidia/minimaxai/minimax-m3
